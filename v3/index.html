<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f5">
  <meta name="description" content="펜촉이 실제 그림의 선을 따라 움직이는 여호수아 이야기 첫 페이지.">
  <title>여호수아와 여리고 성 · 잉크 이야기</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="../mobile.css">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <script type="module" src="./app.js"></script>
  <script type="module" src="../versions.js"></script>
</head>
<body>
  <main class="page">
    <header class="heading">
      <div>
        <p class="overline">그림으로 듣는 성경 이야기</p>
        <h1>여호수아와 여리고 성</h1>
      </div>
      <div class="heading-options"><label class="version-label" for="version-picker">버전 비교</label><select id="version-picker" aria-label="버전 비교" data-base="../"><option value="v1">V1 · 펜 드로잉</option><option value="v2">V2 · 두 사람의 그림 이야기</option><option value="v3" selected>V3 · 화선지와 사군자 먹붓</option></select><p class="reference">첫 페이지 · 사군자 먹붓<span>여호수아 6장</span></p></div>
    </header>

    <section class="player" id="player" aria-label="그림 이야기 재생기" data-state="loading">
      <nav class="chapters single-page" aria-label="첫 페이지">
        <button type="button" data-chapter="0" aria-current="step" disabled><span>1</span>닫힌 성문 앞에서</button>
      </nav>

      <div class="stage" id="stage">
        <canvas id="scene" aria-label="펜과 붓이 선을 따라 그려내는 첫 페이지 그림"></canvas>
        <div class="intro" id="intro">
          <p class="intro-kicker">V3 · 화선지에 스며드는 이야기</p>
          <h2>먹으로 그리는, 기다림</h2>
          <p id="load-message">그림과 목소리를 준비하고 있습니다.</p>
          <button type="button" id="start" disabled>이야기 시작</button>
        </div>
        <div class="scene-note" id="scene-note" aria-hidden="true">첫 번째 장면</div>
        <button class="expand" id="fullscreen" type="button" title="전체 화면" aria-label="전체 화면">크게 보기</button>
      </div>

      <div class="narration">
        <p class="chapter-title" id="chapter-title">닫힌 성문 앞에서</p>
        <div class="speakers" role="group" aria-label="이야기를 들려주는 두 사람"><span data-speaker="준">준 · 질문</span><span data-speaker="이야기꾼">이야기꾼 · 해설</span></div>
        <p class="caption" id="caption" aria-live="off">재생을 누르면 목소리와 함께 그림이 드러납니다.</p>
      </div>

      <div class="timeline">
        <label for="seek" class="sr-only">이야기 재생 위치</label>
        <input id="seek" type="range" min="0" max="100" step="any" value="0" disabled aria-valuetext="시작 전">
        <div class="timecodes"><output id="current-time" aria-live="off">0:00</output><span id="playback-status" role="status">준비 중</span><output id="total-time" aria-live="off">0:00</output></div>
      </div>

      <div class="controls">
        <div class="transport">
          <button id="restart" class="quiet" type="button" disabled>처음부터</button>
          <button id="previous" class="step" type="button" aria-label="이전 장면" disabled hidden>이전</button>
          <button id="play" class="primary" type="button" disabled>재생</button>
          <button id="next" class="step" type="button" aria-label="다음 장면" disabled hidden>다음</button>
        </div>
        <details class="drawing-settings" id="drawing-settings" open><summary>그리기 설정</summary>
        <div class="preferences">
          <button id="mute" class="quiet" type="button" aria-pressed="false">소리 켜짐</button>
          <label for="pen-kind" class="sr-only">그리기 도구</label>
          <select id="pen-kind" aria-label="그리기 도구"><option value="fountain">만년필</option><option value="ballpoint">볼펜</option><option value="pencil">연필</option><option value="korean">한국 먹붓</option><option value="western">서양식 붓</option><option value="charcoal">목탄</option><option value="crayon">검정 크레용</option><option value="sagunja" selected>사군자 먹붓 · 화선지</option></select>
          <label for="ink-kind" class="sr-only">잉크 질감</label>
          <select id="ink-kind" aria-label="잉크 질감"><option value="crisp">또렷한 잉크</option><option value="fountain">만년필 잉크</option><option value="soft">번지는 잉크</option><option value="meok">먹</option><option value="watercolor">흑백 수채</option><option value="charcoal">목탄 가루</option><option value="crayon">검정 크레용</option><option value="sagunja" selected>사군자 먹 · 화선지</option></select>
          <label for="speed" class="sr-only">재생 속도</label>
          <select id="speed" aria-label="재생 속도"><option value="0.75">0.75배</option><option value="1" selected>1배속</option><option value="1.25">1.25배</option><option value="1.5">1.5배</option><option value="2">2배속</option></select>
        </div>
        </details>
      </div>
      <audio id="narrator" preload="metadata" playsinline></audio>
    </section>

    <footer class="footnote"><p>화선지 위에서 눌러 긋고, 가늘게 흘려보냅니다. 마지막 10초에는 완성된 그림을 함께 봅니다. 두 사람의 목소리와 잔잔한 음악으로 함께합니다.</p><span>Space 재생·정지</span></footer>
    <details class="transcript"><summary>이야기 원고 읽기</summary><div id="transcript"></div></details>
    <noscript>이 이야기를 재생하려면 브라우저의 JavaScript를 켜 주세요.</noscript>
  </main>
</body>
</html>
